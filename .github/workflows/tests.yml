name: Tests and distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            dependencies: minimum
          - python: "3.11"
            dependencies: recent
          - python: "3.12"
            dependencies: modern
          - python: "3.13"
            dependencies: modern
          - python: "3.14"
            dependencies: modern
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Freeze the selected core numerical stack
        shell: bash
        run: |
          case "${{ matrix.dependencies }}" in
            minimum) pins="numpy==1.24.0 pandas==2.0.0 scikit-learn==1.4.0 scipy==1.8.0" ;;
            recent) pins="numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 scipy==1.16.2" ;;
            modern) pins="numpy==2.5.3 pandas==2.3.3 scikit-learn==1.9.0 scipy==1.18.1" ;;
            *) exit 1 ;;
          esac
          printf '%s\n' $pins > "$RUNNER_TEMP/codadapt-core-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/codadapt-core-constraints.txt" >> "$GITHUB_ENV"
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -c "$PIP_CONSTRAINT" -e ".[dev]"
      - name: Install recent verified dependency versions
        if: matrix.dependencies == 'recent'
        run: python -m pip install -c "$PIP_CONSTRAINT" -e ".[dev]"
      - name: Install the modern numerical stack verified locally
        if: matrix.dependencies == 'modern'
        run: python -m pip install -c "$PIP_CONSTRAINT" -e ".[dev]"
      - name: Record core dependency versions
        run: |
          python -m pip check
          python -c "import sys,numpy,scipy,pandas,sklearn; print(sys.version); print(numpy.__version__,scipy.__version__,pandas.__version__,sklearn.__version__)"
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests
        run: python -m pytest
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pytest tests/test_packaging.py
      - name: Install wheel in a clean environment and run examples
        run: |
          python -m venv "$RUNNER_TEMP/codadapt-wheel"
          "$RUNNER_TEMP/codadapt-wheel/bin/python" -m pip install dist/codadapt-*-py3-none-any.whl
          mkdir -p "$RUNNER_TEMP/codadapt-smoke"
          cp examples/basic_classification.py examples/basic_regression.py "$RUNNER_TEMP/codadapt-smoke/"
          cd "$RUNNER_TEMP/codadapt-smoke"
          "$RUNNER_TEMP/codadapt-wheel/bin/python" -c "import codadapt; from importlib.metadata import version; print(codadapt.__version__, codadapt.__file__); assert codadapt.__version__ == version('codadapt')"
          "$RUNNER_TEMP/codadapt-wheel/bin/python" basic_classification.py
          "$RUNNER_TEMP/codadapt-wheel/bin/python" basic_regression.py
      - name: Execute example notebook against installed wheel
        if: matrix.python == '3.13'
        run: |
          "$RUNNER_TEMP/codadapt-wheel/bin/python" -m pip install nbformat nbclient ipykernel
          "$RUNNER_TEMP/codadapt-wheel/bin/python" -m ipykernel install --prefix "$RUNNER_TEMP/codadapt-wheel" --name codadapt-wheel
          cp examples/kaggle_quickstart.ipynb "$RUNNER_TEMP/codadapt-smoke/"
          cd "$RUNNER_TEMP/codadapt-smoke"
          "$RUNNER_TEMP/codadapt-wheel/bin/python" -c "import nbformat; from nbclient import NotebookClient; n=nbformat.read('kaggle_quickstart.ipynb', as_version=4); NotebookClient(n, timeout=600, kernel_name='codadapt-wheel').execute(); nbformat.write(n, 'kaggle_quickstart.executed.ipynb')"
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: codadapt-distributions
          path: dist/*
          if-no-files-found: error

  experimental-ebm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            numpy: "2.2.6"
            pandas: "2.3.3"
            sklearn: "1.7.2"
            scipy: "1.15.3"
          - python: "3.11"
            numpy: "2.3.5"
            pandas: "2.2.3"
            sklearn: "1.8.0"
            scipy: "1.16.2"
          - python: "3.12"
            numpy: "2.5.3"
            pandas: "2.3.3"
            sklearn: "1.9.0"
            scipy: "1.18.1"
          - python: "3.13"
            numpy: "2.5.3"
            pandas: "2.3.3"
            sklearn: "1.9.0"
            scipy: "1.18.1"
          - python: "3.14"
            numpy: "2.5.3"
            pandas: "2.3.3"
            sklearn: "1.9.0"
            scipy: "1.18.1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze EBM numerical dependencies
        run: |
          cat > "$RUNNER_TEMP/ebm-constraints.txt" <<'EOF'
          numpy==${{ matrix.numpy }}
          pandas==${{ matrix.pandas }}
          scikit-learn==${{ matrix.sklearn }}
          scipy==${{ matrix.scipy }}
          interpret-core==0.7.8
          EOF
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/ebm-constraints.txt" >> "$GITHUB_ENV"
      - run: |
          python -m pip install -c "$PIP_CONSTRAINT" ".[dev,ebm]"
          python -m pip install --no-deps -e .
          python -m pip check
          python -c "import sys,importlib.metadata as m; print(sys.version); print({n:m.version(n) for n in ['numpy','scipy','pandas','scikit-learn','interpret-core']})"
      - run: python -m build
      - run: python -m pytest

  experimental-safeblend:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy: "2.2.6"
            pandas: "2.3.3"
            sklearn: "1.7.2"
            scipy: "1.15.3"
          # Isolated core/extra stacks verified locally; fixed teachers and thread controls.
          - python: "3.11"
            numpy: "2.3.5"
            pandas: "2.2.3"
            sklearn: "1.8.0"
            scipy: "1.16.2"
          - python: "3.12"
            numpy: "2.5.3"
            pandas: "2.3.3"
            sklearn: "1.9.0"
            scipy: "1.18.1"
          - python: "3.13"
            numpy: "2.5.3"
            pandas: "2.3.3"
            sklearn: "1.9.0"
            scipy: "1.18.1"
          - python: "3.14"
            numpy: "2.5.3"
            pandas: "2.3.3"
            sklearn: "1.9.0"
            scipy: "1.18.1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze numerical dependencies for every subsequent pip invocation
        run: |
          cat > "$RUNNER_TEMP/safeblend-constraints.txt" <<'EOF'
          numpy==${{ matrix.numpy }}
          pandas==${{ matrix.pandas }}
          scikit-learn==${{ matrix.sklearn }}
          scipy==${{ matrix.scipy }}
          lightgbm==4.7.0
          EOF
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/safeblend-constraints.txt" >> "$GITHUB_ENV"
      - name: Install constrained dependencies then editable package without dependency resolution
        run: |
          python -m pip install -c "$PIP_CONSTRAINT" ".[dev,safeblend]"
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Print and verify numerical stack and active thread pools
        run: |
          python - <<'PY'
          import json, platform
          import numpy, scipy, pandas, sklearn, lightgbm
          from scipy.linalg import cho_factor
          from threadpoolctl import threadpool_info, threadpool_limits
          from codadapt import __version__
          expected = {
              "numpy": "${{ matrix.numpy }}", "scipy": "${{ matrix.scipy }}",
              "pandas": "${{ matrix.pandas }}", "scikit-learn": "${{ matrix.sklearn }}",
              "lightgbm": "4.7.0",
          }
          actual = {
              "numpy": numpy.__version__, "scipy": scipy.__version__,
              "pandas": pandas.__version__, "scikit-learn": sklearn.__version__,
              "lightgbm": lightgbm.__version__,
          }
          print("Python:", platform.python_version(), "CodAdapt:", __version__, flush=True)
          print(json.dumps(actual, indent=2), flush=True)
          print("threadpool_info:", json.dumps(threadpool_info(), indent=2), flush=True)
          assert actual == expected, (actual, expected)
          with threadpool_limits(limits=1):
              pools = threadpool_info()
              print("test thread pools:", json.dumps(pools, indent=2), flush=True)
              assert all(p["num_threads"] == 1 for p in pools)
          PY
      - name: Isolated SciPy Cholesky smoke (SCIPY_BACKEND_FAILURE on failure)
        shell: bash
        run: |
          if python -X faulthandler - <<'PY'
          import numpy as np
          from scipy.linalg import cho_factor, cho_solve
          from threadpoolctl import threadpool_limits
          with threadpool_limits(limits=1):
              rng = np.random.default_rng(20261003)
              a = rng.normal(size=(1024, 1024)).astype(np.float64)
              gram = a.T @ a / 1024 + np.eye(1024, dtype=np.float64)
              rhs = rng.normal(size=1024).astype(np.float64)
              solution = cho_solve(cho_factor(gram, lower=True, check_finite=False),
                                   rhs, check_finite=False)
              assert np.isfinite(solution).all()
              np.testing.assert_allclose(gram @ solution, rhs, rtol=1e-10, atol=1e-10)
          print("SCIPY_CHOLESKY_SMOKE_PASS", flush=True)
          PY
          then
            echo "SciPy backend smoke completed independently of SafeBlend"
          else
            status=$?
            echo "::error::SCIPY_BACKEND_FAILURE: isolated Cholesky smoke exit $status"
            exit "$status"
          fi
      - name: Build distributions for packaging tests
        run: python -m build
      - name: SafeBlend and packaging contract tests
        shell: bash
        run: |
          if python -X faulthandler -m pytest tests/test_safe_blend.py tests/test_packaging.py; then
            echo "SAFEBLEND_CONTRACT_PASS"
          else
            status=$?
            if [ "$status" -eq 139 ]; then
              echo "::error::SAFEBLEND_SPECIFIC_NATIVE_FAILURE: SciPy smoke passed, contract tests segfaulted"
            fi
            exit "$status"
          fi
      - name: Full public suite on the same frozen stack
        run: python -X faulthandler -m pytest
