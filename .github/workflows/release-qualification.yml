{
  "name": "Manual release qualification (no publishing)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "OMP_NUM_THREADS": "1",
    "OPENBLAS_NUM_THREADS": "1",
    "MKL_NUM_THREADS": "1",
    "NUMEXPR_NUM_THREADS": "1"
  },
  "jobs": {
    "native-artifacts": {
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "windows-latest",
            "macos-latest"
          ],
          "python": [
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Install release tools",
          "run": "python -m pip install \".[dev]\""
        },
        {
          "name": "Lint, build and validate archives",
          "run": "python -m ruff check .\npython -m ruff format --check .\npython -m build\npython -m twine check dist/*"
        },
        {
          "name": "Fresh wheel and sdist qualification",
          "shell": "bash",
          "run": "set -euo pipefail\npython -m venv \"$RUNNER_TEMP/wheel-env\"\npython -m venv \"$RUNNER_TEMP/sdist-env\"\nif [ \"$RUNNER_OS\" = Windows ]; then exe=Scripts/python.exe; else exe=bin/python; fi\nw=\"$RUNNER_TEMP/wheel-env/$exe\"\ns=\"$RUNNER_TEMP/sdist-env/$exe\"\n\"$w\" -m pip install dist/*.whl pytest\n\"$s\" -m pip install dist/*.tar.gz\nfor p in \"$w\" \"$s\"; do\n  \"$p\" -m pip check\n  \"$p\" -I -c \"import numpy,scipy,scipy.linalg,pandas,sklearn; scipy.linalg.cholesky(numpy.eye(3)); import codadapt,sys; from pathlib import Path; from importlib.metadata import version; assert Path(codadapt.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert codadapt.__version__==version('codadapt'); print(sys.version,codadapt.__file__)\"\n  \"$p\" -I -c \"import importlib.util as u; assert all(u.find_spec(n) is None for n in ['interpret','lightgbm','xgboost','catboost'])\"\ndone\n\"$w\" -I -m pytest -p no:cacheprovider --basetemp=\"$RUNNER_TEMP/pytest-wheel\" --junitxml=wheel-tests.xml\nfor pair in \"wheel:$w\" \"sdist:$s\"; do\n  label=\"${pair%%:*}\"; p=\"${pair#*:}\"\n  \"$p\" -I examples/release_smoke.py \"$RUNNER_TEMP/probe-$label\" fit\n  \"$p\" -I examples/release_smoke.py \"$RUNNER_TEMP/probe-$label\" load\n  \"$p\" -I examples/basic_classification.py\n  \"$p\" -I examples/basic_multiclass.py\n  \"$p\" -I examples/basic_regression.py\ndone\n"
        },
        {
          "uses": "actions/upload-artifact@v7",
          "if": "always()",
          "with": {
            "name": "qualification-${{ matrix.os }}-${{ matrix.python }}",
            "path": "wheel-tests.xml\ndist/*",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "optional-ebm": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Install optional compiler",
          "run": "python -m pip install \".[dev,ebm]\"\npython -m pip check"
        },
        {
          "name": "Build and test installed optional package",
          "run": "python -m build\npython -m twine check dist/*\npython -I -m pytest -p no:cacheprovider --junitxml=ebm-tests.xml"
        },
        {
          "uses": "actions/upload-artifact@v7",
          "if": "always()",
          "with": {
            "name": "optional-ebm-${{ matrix.python }}",
            "path": "ebm-tests.xml",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
