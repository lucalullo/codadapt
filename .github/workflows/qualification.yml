name: Release qualification checks - Python backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create isolated CI environment
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          venv = Path(os.environ["RUNNER_TEMP"]) / "codadapt-ci-venv"
          subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
          bin_dir = venv / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              print(bin_dir, file=path_file)
      - name: Verify isolated Python environment
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          expected = Path(os.environ["RUNNER_TEMP"]) / "codadapt-ci-venv"
          assert Path(sys.prefix).resolve() == expected.resolve()
          assert sys.prefix != sys.base_prefix
      - name: Install CI dependencies and packaging validators
        run: python -m pip install -r requirements/ci.txt -r requirements/packaging.txt -r requirements/test-optional.txt
      - name: Verify source and deterministic distributions
        run: python -B tools/verify_repository.py
      - name: Verify workflow safety
        run: python -B tools/check_workflows.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check exact distribution metadata and README rendering
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          assert len(artifacts) == 2
          subprocess.run([sys.executable, "-m", "twine", "check", "--strict", *map(str, artifacts)], check=True)
      - name: Install built wheel and verify dependencies
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", "--force-reinstall", str(wheels[0])], check=True)
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
      - name: Run installed-package tests (no benchmark datasets)
        run: python -m pytest -q tests
