name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified distributions to TestPyPI (not PyPI)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    outputs:
      wheel_sha256: ${{ steps.package_hashes.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.package_hashes.outputs.sdist_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create isolated CI environment
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          venv = Path(os.environ["RUNNER_TEMP"]) / "codadapt-ci-venv"
          subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
          bin_dir = venv / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              print(bin_dir, file=path_file)
      - name: Verify isolated Python environment
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          expected = Path(os.environ["RUNNER_TEMP"]) / "codadapt-ci-venv"
          assert Path(sys.prefix).resolve() == expected.resolve()
          assert sys.prefix != sys.base_prefix
      - name: Install CI dependencies and packaging validators
        run: python -m pip install -r requirements/ci.txt -r requirements/packaging.txt -r requirements/test-optional.txt
      - name: Verify source and deterministic distributions
        run: python -B tools/verify_repository.py
      - name: Verify workflow safety
        run: python -B tools/check_workflows.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check exact distribution metadata and README rendering
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          assert len(artifacts) == 2
          subprocess.run([sys.executable, "-m", "twine", "check", "--strict", *map(str, artifacts)], check=True)
      - name: Install built wheel and verify dependencies
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", "--force-reinstall", str(wheels[0])], check=True)
          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
      - name: Run installed-package tests (no benchmark datasets)
        run: python -m pytest -q tests
      - name: Record verified distribution hashes
        id: package_hashes
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          expected = {"wheel_sha256": "codadapt-2.2.0-py3-none-any.whl", "sdist_sha256": "codadapt-2.2.0.tar.gz"}
          assert {p.name for p in Path("dist").iterdir()} == set(expected.values())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, name in expected.items():
                  digest = hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest()
                  print(f"{key}={digest}", file=output)
                  print(f"{digest}  {name}")
      - name: Store verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codadapt-testpypi-distributions
          path: |
            dist/codadapt-2.2.0-py3-none-any.whl
            dist/codadapt-2.2.0.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to TestPyPI
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/codadapt/
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codadapt-testpypi-distributions
          path: dist
      - name: Authenticate distributions before publication
        shell: bash
        env:
          EXPECTED_WHEEL: ${{ needs.verify.outputs.wheel_sha256 }}
          EXPECTED_SDIST: ${{ needs.verify.outputs.sdist_sha256 }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, os, re
          from pathlib import Path
          expected = {"codadapt-2.2.0-py3-none-any.whl": os.environ["EXPECTED_WHEEL"], "codadapt-2.2.0.tar.gz": os.environ["EXPECTED_SDIST"]}
          assert {p.name for p in Path("dist").iterdir()} == set(expected)
          for name, digest in expected.items():
              assert re.fullmatch(r"[0-9a-f]{64}", digest)
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest, name
          PYCODE
      - name: Publish to TestPyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
