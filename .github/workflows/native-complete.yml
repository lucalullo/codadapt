name: Owner-operated final native qualification (no publication)
on:
  workflow_dispatch:
    inputs:
      host:
        type: choice
        options: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        required: true
      python:
        description: Requested CPython patch/minor; actual version is recorded
        default: '3.13.15'
        required: true
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ${{ inputs.host }}
    timeout-minutes: 35
    env:
      NETRC: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
      - name: Activate Microsoft C++ compiler (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
      - name: Verify Microsoft C++ environment (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if (-not $env:INCLUDE -or -not $env:LIB) { throw 'MSVC INCLUDE/LIB environment is missing' }
          Write-Host "MSVC compiler: $compiler"
          Write-Host "MSVC linker: $linker"
      - name: Launcher process-budget dependency
        run: >-
          python -I -B -m pip --isolated --disable-pip-version-check --no-input --keyring-provider disabled install --index-url https://pypi.org/simple --only-binary=:all: psutil==7.2.2
      - name: Actual host chain with failure ZIP
        if: always()
        shell: python
        env:
          CODADAPT_EXPECTED_PYTHON: ${{ inputs.python }}
        run: |
          import os, subprocess, sys
          raise SystemExit(subprocess.call([
              sys.executable, '-I', '-B', 'tools/run_external.py',
              '--context', 'ci', '--expected-python', os.environ['CODADAPT_EXPECTED_PYTHON'],
              '--output', 'qualification_runs/final', '--allow-public-index']))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codadapt-${{ inputs.host }}-${{ inputs.python }}
          path: qualification_runs/final/CODADAPT_210_EXTERNAL_RESULTS.zip
          if-no-files-found: warn
