[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codadapt"
dynamic = ["version"]
description = "Experimental tabular learning with adaptive coded memory and shared multi-resolution encoding"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Luca Lullo"}]
keywords = ["tabular", "machine-learning", "adaptive-codes", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/lucalullo/codadapt"
Repository = "https://github.com/lucalullo/codadapt"
Issues = "https://github.com/lucalullo/codadapt/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.9", "build>=1.2", "twine>=5", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
benchmark = ["lightgbm>=4.0", "psutil>=5.9"]

[tool.setuptools.dynamic]
version = {attr = "codadapt._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", ".venv", "benchmark_results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
